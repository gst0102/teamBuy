<!doctype html>
<html lang="zh-CN">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #080d1d; color: #f4f7ff; font-family: sans-serif; }
  body { padding: 28px 20px 24px; }
  .eyebrow { color: #69d7a1; font-size: 13px; letter-spacing: 2px; }
  h1 { margin: 8px 0 6px; font-size: 30px; }
  .intro { margin: 0 0 22px; color: #aab6d2; font-size: 15px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  button { min-height: 142px; padding: 16px 10px; border: 1px solid #283657; border-radius: 18px; background: #121b32; color: #f4f7ff; text-align: left; }
  button:active { background: #1d2b4b; border-color: #69d7a1; }
  button.slot { width: 100%; }
  button.slot.disabled { border-color: #1b2742; background: #0d1428; color: #657391; opacity: .72; }
  button.slot.disabled .num { background: #18233b; color: #657391; }
  button.slot.disabled .sub { color: #5d6a84; }
  button.slot:disabled { cursor: default; }
  .num { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 9px; background: #253557; color: #9fe8c3; font-size: 13px; }
  .title { display: block; margin-top: 18px; font-size: 17px; font-weight: 700; }
  .sub { display: block; margin-top: 7px; color: #96a4c3; font-size: 11px; line-height: 1.35; }
  .exit { display: flex; width: 100%; min-height: 44px; margin-top: 16px; padding: 10px 14px; align-items: center; justify-content: center; border: 1px solid #3a496b; border-radius: 12px; background: #0d1428; color: #aab6d2; font-size: 14px; }
  .tap-state { min-height: 22px; margin-top: 10px; color: #69d7a1; font-size: 12px; }
  .footer { margin-top: 22px; padding-top: 14px; border-top: 1px solid #1f2a45; color: #71809f; font-size: 12px; }
</style>
</head>
<body>
  <div class="eyebrow">ASCRIPT TOOLBOX</div>
  <h1>微信助手</h1>
  <p class="intro">先扫描 g10 群台账，再按 PC 批次转发微信卡片。</p>
  <div class="grid">
    <button class="slot" type="button" ontouchend="pick('send_batches', event)" onclick="pick('send_batches', event)"><span class="num">1</span><span class="title">群发微信</span><span class="sub">扫描群台账 · 读取批次 · 转发卡片</span></button>
    <button class="slot disabled" type="button" disabled><span class="num">2</span><span class="title">鸿蒙适配</span><span class="sub">下一轮调试控件树与 HID</span></button>
    <button class="slot disabled" type="button" disabled><span class="num">3</span><span class="title">iOS 适配</span><span class="sub">后续扩展</span></button>
    <button class="slot disabled" type="button" disabled><span class="num">4</span><span class="title">群台账工具</span><span class="sub">后续扩展</span></button>
    <button class="slot disabled" type="button" disabled><span class="num">5</span><span class="title">批次管理</span><span class="sub">由 PC 端配置</span></button>
    <button class="slot disabled" type="button" disabled><span class="num">6</span><span class="title">发送记录</span><span class="sub">后续扩展</span></button>
    <button class="slot disabled" type="button" disabled><span class="num">7</span><span class="title">设备诊断</span><span class="sub">后续扩展</span></button>
    <button class="slot disabled" type="button" disabled><span class="num">8</span><span class="title">预留扩展</span><span class="sub">后续扩展</span></button>
    <button class="slot disabled" type="button" disabled><span class="num">9</span><span class="title">预留扩展</span><span class="sub">后续扩展</span></button>
  </div>
  <div id="tap-state" class="tap-state">状态：等待选择</div>
  <button class="exit" ontouchend="exitLauncher(event)" onclick="exitLauncher(event)">退出九宫格</button>
  <div class="footer">当前启用：Android 群发微信 · 其他卡位为后续扩展</div>
<script>
  var lastActionAt = 0;
  function send(key, value) {
    if (!window.airscript || typeof window.airscript.call !== 'function') {
      document.getElementById('tap-state').textContent = '状态：页面通信桥未就绪';
      return;
    }
    try {
      window.airscript.call(key, value);
    } catch (error) {
      document.getElementById('tap-state').textContent = '状态：操作提交失败';
    }
  }
  function pick(id, event) {
    if (event && event.type === 'touchend') event.preventDefault();
    var now = Date.now();
    if (now - lastActionAt < 500) return;
    lastActionAt = now;
    document.getElementById('tap-state').textContent = '状态：正在打开' + id;
    send('feature', id);
  }
  function exitLauncher(event) {
    if (event && event.type === 'touchend') event.preventDefault();
    send('window_closed', 'user_exit');
  }
</script>
</body>
</html>
