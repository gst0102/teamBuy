<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>资源工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef6ff;
      --panel: #ffffff;
      --text: #101828;
      --muted: #667085;
      --line: #dbe7f5;
      --blue: #1677ff;
      --green: #12b76a;
      --soft-blue: #e9f2ff;
      --soft-green: #e9fbf2;
      --shadow: 0 14px 38px rgba(16, 24, 40, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #e8f4ff 0%, #f7fbff 46%, #ffffff 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .page {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 18px 16px calc(28px + env(safe-area-inset-bottom));
    }

    .hero {
      padding: 22px 20px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      margin: 0 0 6px;
      color: #008f5d;
      font-size: 14px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.14;
      letter-spacing: 0;
    }

    .hero p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) 42px;
      gap: 8px;
      margin: 14px 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
    }

    .tab,
    .icon-btn,
    .primary-btn,
    .ghost-btn {
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-weight: 800;
      text-align: center;
      transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease, color 160ms ease, border-color 160ms ease, opacity 160ms ease;
    }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus {
      outline: none;
    }

    button:focus-visible {
      box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.18);
    }

    .tab {
      min-width: 0;
      padding: 0 8px;
      background: #f2f5f9;
      color: #344054;
      font-size: 14px;
    }

    .tab.secondary {
      display: none;
    }

    .tab.active {
      background: var(--blue);
      color: #ffffff;
    }

    .icon-btn {
      width: 42px;
      background: var(--soft-blue);
      color: var(--blue);
      font-size: 18px;
    }

    .status {
      min-height: 42px;
      margin-bottom: 14px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .status strong {
      color: var(--text);
    }

    .actionbar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .action-chip {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #1677ff;
      background: rgba(255, 255, 255, 0.86);
      font-size: 14px;
      font-weight: 900;
      white-space: nowrap;
    }

    .action-chip.active {
      color: #ffffff;
      border-color: #1677ff;
      background: #1677ff;
      box-shadow: 0 8px 20px rgba(22, 119, 255, 0.22);
    }

    .search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 14px;
      background: #ffffff;
      color: var(--text);
      outline: none;
    }

    .page-home {
      display: grid;
      gap: 14px;
    }

    .session-expired-card {
      padding: 20px 18px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98) 0%, rgba(246,250,255,0.98) 100%);
      box-shadow: 0 16px 34px rgba(16, 24, 40, 0.08);
    }

    .session-expired-eyebrow {
      color: #b54708;
      font-size: 14px;
      font-weight: 900;
    }

    .session-expired-title {
      margin-top: 8px;
      color: var(--text);
      font-size: 26px;
      line-height: 1.2;
      font-weight: 900;
    }

    .session-expired-copy {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      font-weight: 700;
    }

    .session-expired-note {
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      color: #7a271a;
      background: #fff7ed;
      box-shadow: inset 4px 0 0 #f79009;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 800;
    }

    .session-expired-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .module-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .module-card {
      min-height: 128px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(16, 24, 40, 0.06);
      text-align: left;
    }

    .module-card strong {
      display: block;
      color: var(--text);
      font-size: 18px;
      line-height: 1.35;
    }

    .module-card span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 700;
    }

    .section-title {
      margin: 4px 0 0;
      color: var(--text);
      font-size: 18px;
      font-weight: 900;
    }

    .lead-home {
      display: grid;
      gap: 14px;
    }

    .lead-summary-card {
      position: relative;
      padding: 14px;
      border: 1px solid #b9ead2;
      border-radius: 12px;
      background: linear-gradient(135deg, #effdf6 0%, #f9fffc 100%);
      box-shadow: 0 10px 28px rgba(16, 185, 129, 0.08);
      overflow: hidden;
    }

    .lead-summary-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 12%, rgba(255, 255, 255, 0.72) 42%, transparent 68%);
      transform: translateX(-120%);
      animation: radar-scan 5.6s linear infinite;
      pointer-events: none;
    }

    @keyframes radar-scan {
      from { transform: translateX(-120%); }
      to { transform: translateX(120%); }
    }

    .lead-summary-head {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }

    .lead-summary-headline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .lead-live-pill {
      min-height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #027a48;
      background: rgba(255, 255, 255, 0.92);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(0, 158, 95, 0.12);
    }

    .funnel-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: #009e5f;
      font-size: 22px;
      font-weight: 900;
    }

    .lead-summary-title {
      color: #172033;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.35;
    }

    .lead-summary-sub {
      margin-top: 4px;
      color: #667085;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 700;
    }

    .lead-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .lead-stat {
      min-height: 64px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      box-shadow: 0 8px 18px rgba(16, 24, 40, 0.04);
    }

    .lead-stat span {
      color: #344054;
      font-size: 12px;
      font-weight: 800;
    }

    .lead-stat strong {
      margin-top: 6px;
      font-size: 22px;
      line-height: 1;
      font-weight: 900;
    }

    .lead-quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .lead-signal-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }

    .lead-panel-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .lead-panel-node {
      min-width: 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.84);
      box-shadow: inset 0 0 0 1px rgba(185, 234, 210, 0.86);
    }

    .lead-panel-node span {
      display: block;
      color: #98a2b3;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .lead-panel-node strong {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      color: #172033;
      font-size: 13px;
      line-height: 1.35;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lead-panel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
      background: #12b76a;
      box-shadow: 0 0 0 0 rgba(18, 183, 106, 0.3);
      animation: pulse-dot 1.8s ease-out infinite;
    }

    @keyframes pulse-dot {
      0% { box-shadow: 0 0 0 0 rgba(18, 183, 106, 0.3); }
      70% { box-shadow: 0 0 0 8px rgba(18, 183, 106, 0); }
      100% { box-shadow: 0 0 0 0 rgba(18, 183, 106, 0); }
    }

    .lead-signal-copy {
      color: #475467;
      font-size: 12px;
      line-height: 1.4;
      font-weight: 700;
    }

    .lead-signal-bars {
      display: flex;
      align-items: end;
      gap: 4px;
      height: 26px;
    }

    .lead-signal-bars span {
      width: 5px;
      border-radius: 999px;
      background: linear-gradient(180deg, #009e5f 0%, #9ce8bf 100%);
      animation: bars-wave 1.8s ease-in-out infinite;
      transform-origin: bottom;
    }

    .lead-signal-bars span:nth-child(1) { height: 10px; animation-delay: 0s; }
    .lead-signal-bars span:nth-child(2) { height: 18px; animation-delay: 0.15s; }
    .lead-signal-bars span:nth-child(3) { height: 13px; animation-delay: 0.3s; }
    .lead-signal-bars span:nth-child(4) { height: 22px; animation-delay: 0.45s; }

    @keyframes bars-wave {
      0%, 100% { transform: scaleY(0.82); opacity: 0.72; }
      50% { transform: scaleY(1.08); opacity: 1; }
    }

    .lead-quick-btn {
      min-height: 38px;
      border: 1px solid #b9ead2;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #009e5f;
      background: #ffffff;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .lead-summary-card button:active,
    .toolbar button:active,
    .actionbar button:active,
    .lead-actions button:active,
    .saved-card-actions button:active,
    .mine-header-actions button:active,
    .sub-chip:active,
    .filter-chip:active,
    .quick-chip:active,
    .market-hero-action:active,
    .contact-line-btn:active,
    .selected-resource:active,
    .resource-option:active,
    .more-match-item:active,
    .action-option:active,
    .follow-action:active {
      transform: translateY(1px) scale(0.992);
    }

    .lead-stat strong.green {
      color: #009e5f;
    }

    .lead-stat strong.blue {
      color: #1677ff;
    }

    .lead-stat strong.dark {
      color: #101828;
    }

    .lead-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      margin-top: 4px;
    }

    .lead-tab {
      position: relative;
      min-height: 46px;
      border: 0;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #344054;
      background: transparent;
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
    }

    .lead-tab.active {
      color: #101828;
    }

    .lead-tab.active::after {
      content: "";
      position: absolute;
      left: 17%;
      right: 17%;
      bottom: 0;
      height: 3px;
      border-radius: 999px;
      background: #009e5f;
    }

    .lead-card {
      padding: 14px;
      border: 1px solid #dbe6f7;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(31, 88, 168, 0.06);
    }

    .lead-card-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }

    .lead-score-badge {
      min-width: 56px;
      min-height: 56px;
      padding: 8px 6px;
      border-radius: 14px;
      display: grid;
      justify-items: center;
      align-content: center;
      color: #009e5f;
      background: #effdf6;
      box-shadow: inset 0 0 0 1px #c8efd9;
    }

    .lead-score-badge strong {
      font-size: 20px;
      line-height: 1;
      font-weight: 900;
    }

    .lead-score-badge span {
      margin-top: 4px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .lead-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .lead-badge {
      min-height: 28px;
      padding: 0 9px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #027a48;
      background: #dcfae6;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .lead-badge.blue {
      color: #1677ff;
      background: #eaf2ff;
    }

    .lead-badge.orange {
      color: #f59e0b;
      background: #fff7ed;
    }

    .lead-badge.gray {
      color: #667085;
      background: #f2f4f7;
    }

    .lead-title {
      margin-top: 10px;
      color: #101828;
      font-size: 18px;
      line-height: 1.28;
      font-weight: 900;
      letter-spacing: 0;
    }

    .lead-summary {
      margin-top: 8px;
      color: #475467;
      font-size: 13px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .lead-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      color: #667085;
      font-size: 12px;
      font-weight: 800;
    }

    .lead-meta span:last-child {
      margin-left: auto;
    }

    .lead-meta-pill {
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f8fbff;
      color: #475467;
      box-shadow: inset 0 0 0 1px #e4ecf7;
      white-space: nowrap;
    }

    .lead-time {
      color: #667085;
      white-space: nowrap;
    }

    .lead-card-divider {
      height: 1px;
      margin-top: 12px;
      background: linear-gradient(90deg, #edf2f7 0%, #dbe6f7 52%, #edf2f7 100%);
    }

    .lead-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .lead-actions button {
      min-height: 38px;
      border-radius: 8px;
      border: 1px solid #009e5f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .lead-actions .outline {
      color: #009e5f;
      background: #ffffff;
    }

    .lead-actions .solid {
      color: #ffffff;
      background: #009e5f;
      box-shadow: 0 8px 20px rgba(0, 158, 95, 0.2);
    }

    .my-opportunity-page {
      display: grid;
      gap: 12px;
    }

    .match-overview-card {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
      padding: 18px;
      border: 1px solid #dbe6f7;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 10px 26px rgba(31, 88, 168, 0.06);
    }

    .match-number-label {
      color: #344054;
      font-size: 14px;
      font-weight: 900;
    }

    .match-number {
      margin-top: 8px;
      color: #009e5f;
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
    }

    .match-level {
      margin-top: 10px;
      color: #009e5f;
      font-size: 15px;
      font-weight: 900;
    }

    .match-desc {
      margin-top: 6px;
      color: #667085;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 700;
    }

    .match-radar-wrap {
      position: relative;
      min-height: 166px;
    }

    .match-axis-label {
      position: absolute;
      color: #172033;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .axis-city { left: 50%; top: 0; transform: translateX(-50%); }
    .axis-industry { right: 0; top: 52px; }
    .axis-demand { right: 20px; bottom: 8px; }
    .axis-contact { left: 22px; bottom: 8px; }
    .axis-time { left: 0; top: 62px; }

    .match-radar {
      position: absolute;
      left: 50%;
      top: 28px;
      width: 122px;
      height: 122px;
      transform: translateX(-50%);
    }

    .match-radar .radar-ring,
    .match-radar .radar-axis,
    .match-radar .radar-shape {
      position: absolute;
    }

    .match-radar .radar-ring {
      border: 1px solid #d7e5f8;
      border-radius: 50%;
    }

    .match-radar .ring-1 { inset: 0; }
    .match-radar .ring-2 { inset: 20px; }
    .match-radar .ring-3 { inset: 40px; }
    .match-radar .axis-h {
      left: 0;
      top: 61px;
      width: 122px;
      height: 1px;
      background: #dfe9f8;
    }
    .match-radar .axis-v {
      left: 61px;
      top: 0;
      width: 1px;
      height: 122px;
      background: #dfe9f8;
    }
    .match-radar .radar-shape {
      left: 22px;
      top: 14px;
      width: 78px;
      height: 88px;
      border: 2px solid #009e5f;
      border-radius: 20px 32px 24px 30px;
      background: rgba(0, 158, 95, 0.18);
      transform: skew(-8deg) rotate(14deg);
    }

    .my-primary-card {
      padding: 14px;
      border: 1px solid #dbe6f7;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 10px 26px rgba(31, 88, 168, 0.06);
    }

    .my-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .my-section-label {
      margin-top: 16px;
      color: #101828;
      font-size: 15px;
      font-weight: 900;
    }

    .my-reason-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .my-reason-tags span {
      min-height: 30px;
      padding: 0 12px;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #027a48;
      background: #dcfae6;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .my-date-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      color: #475467;
      font-size: 13px;
      font-weight: 800;
    }

    .my-action-title {
      margin-top: 18px;
      color: #101828;
      font-size: 15px;
      font-weight: 900;
    }

    .my-main-action {
      width: 100%;
      min-height: 48px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: #009e5f;
      font-size: 15px;
      font-weight: 900;

    async function apiGet(path) {
      const response = await fetch(apiPath(path), {
        credentials: "same-origin",
        headers: { "Accept": "application/json" }
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(payload.detail || payload.message || "接口读取失败");
      }
      return payload.data;
    }

    async function apiPost(path, data = {}) {
      const response = await fetch(apiPath(path), {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {

      }
      return payload.data;

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatTags(tags = []) {
      return (tags || []).filter(Boolean).map((tag) => `<span class="chip">${escapeHtml(tag)}</span>`).join("");
    }

    function renderFilters() {

    function renderQuickOptions(inputId, currentValue = "") {
      const options = quickInputGroups[inputId] || [];
      if (!options.length) return "";
      const value = currentValue || readInput(inputId);
      return `
        <div class="quick-options">
          ${options.map((option) => `<button class="quick-chip ${value === option ? "active" : ""}" type="button" data-action="quick-fill" data-input-id="${escapeHtml(inputId)}" data-value="${escapeHtml(option)}">${escapeHtml(option)}</button>`).join("")}
        </div>
      `;
    }

    function applyListSort(items = []) {
      const cloned = [...items];
      if (state.filters.sort === "latest") {
        return cloned.sort((a, b) => {
          const left = Date.parse(a.updatedAt || a.createdAt || 0) || 0;
          const right = Date.parse(b.updatedAt || b.createdAt || 0) || 0;
          return right - left;
        });
      }
      return cloned.sort((a, b) => Number(b.matchScore || b.score || 0) - Number(a.matchScore || a.score || 0));
    }

    function clientFilterItems(items = []) {
      const { city, industry, demandType, cardType, contactRequirement } = state.filters;
      const keyword = String(state.keyword || "").trim();
      const matchText = (value, filter) => {
        if (!filter) return true;
        const text = String(value || "");
        return text === filter || text.includes(filter) || filter.includes(text);
      };
      return items.filter((item) => {
        if (keyword) {
          const haystack = [item.title, item.summary, item.city, item.industry, item.demandType, item.cardType, item.contact].filter(Boolean).join(" ");
          if (!haystack.includes(keyword)) return false;
        }
        if (!matchText(item.city, city)) return false;
        if (!matchText(item.industry, industry)) return false;
        if (!matchText(item.cardType, cardType)) return false;
        if (!matchText(item.demandType, demandType)) return false;
        if (!matchText(item.contact, contactRequirement)) return false;
        return true;
      });
    }

    function listQuery(extra = {}) {
      const params = new URLSearchParams(extra);
      if (state.keyword) params.set("keyword", state.keyword);
      ["city", "industry", "demandType", "cardType", "contactRequirement"].forEach((key) => {
        if (state.filters[key]) params.set(key, state.filters[key]);
      });
      const value = params.toString();
      return value ? `?${value}` : "";
    }

    function keywordQuery(extra = {}) {
      const params = new URLSearchParams(extra);
      if (state.keyword) params.set("keyword", state.keyword);
      const value = params.toString();
      return value ? `?${value}` : "";

    }

    function scoreLead(item, index) {
      const direct = Number(item.matchScore || item.score || 0);
      if (direct) return Math.max(60, Math.min(99, direct));
      let score = 72;
      if (item.city) score += 7;
      if (item.industry) score += 6;
      if (item.demandType) score += 5;
      if (item.hasContact || item.contactStatus === "available") score += 8;
      return Math.max(60, Math.min(96, score - index * 2));
    }

    function normalizeOpportunity(item, index) {

        id: item.id || "",
        title: item.title || "未命名机会",

    function selectedResourcePayload() {
      const selected = document.querySelector("[data-resource-selected='1']");
      if (!selected) return {};
      const type = selected.dataset.resourceType || "";
      const id = selected.dataset.resourceId || "";
      return {
        linkedResourceType: type,
        linkedResourceId: id,
        linkedNoteId: type === "note" ? id : ""
      };
    }

    function selectResource(type, id) {
      document.querySelectorAll("[data-resource-id]").forEach((node) => {
        const selected = node.dataset.resourceType === type && node.dataset.resourceId === id;
        node.dataset.resourceSelected = selected ? "1" : "0";
        const tile = node.closest(".resource-tile");
        if (tile) tile.classList.toggle("active", selected);
      });
      const resource = (state.resourceOptions || []).find((item) => item.type === type && item.id === id);
      if (!state.publishDraft) state.publishDraft = buildPublishDraft({});
      if (resource) {
        state.publishDraft.linkedResourceType = resource.type;
        state.publishDraft.linkedResourceId = resource.id;
      }
      const label = document.getElementById("sd-resource-label");
      if (label) {
        label.dataset.resourceType = resource ? resource.type : "";
        label.dataset.resourceId = resource ? resource.id : "";
        label.innerHTML = resource
          ? `<span class="resource-icon ${resource.type === "showcase" ? "green" : ""}">${resource.type === "showcase" ? "⌂" : "📣"}</span><span><strong>${escapeHtml(resource.title)}</strong><span>${escapeHtml(resource.updatedAt ? `更新时间：${resource.updatedAt}` : (resource.meta || "查看详情"))}</span></span><span>›</span>`
          : `<span class="resource-icon">📣</span><span><strong>请选择一条资料</strong><span>查看详情</span></span><span>›</span>`;
      }
    }

    function clearResource() {
      document.querySelectorAll("[data-resource-id]").forEach((node) => {
        node.dataset.resourceSelected = "0";
        const tile = node.closest(".resource-tile");
        if (tile) tile.classList.remove("active");
      });
      const label = document.getElementById("sd-resource-label");
      if (label) {
        label.dataset.resourceType = "";
        label.dataset.resourceId = "";
        label.innerHTML = `<span class="resource-icon">📣</span><span><strong>请选择一条资料</strong><span>查看详情</span></span><span>›</span>`;
      }
    }

    function setCardType(value) {
      const normalized = value === "demand" ? "demand" : "supply";
      const input = document.getElementById("sd-card-type");
      if (input) input.value = normalized;
      document.querySelectorAll("[data-action='set-card-type']").forEach((node) => {
        node.classList.toggle("active", node.dataset.value === normalized);
      });
    }

    function quickFillInput(inputId, value) {
      const input = document.getElementById(inputId);
      if (!input) return;
      input.value = value || "";
      document.querySelectorAll(`[data-action='quick-fill'][data-input-id='${inputId}']`).forEach((node) => {
        node.classList.toggle("active", node.dataset.value === input.value);
      });
    }

    function searchMarket() {
      const input = document.getElementById("market-search-keyword");
      state.keyword = input ? input.value.trim() : "";
      loadData();
    }

    function appendSubscriptionKeyword(value) {
      if (!value) return;
      const input = document.getElementById("sub-keywords");
      if (!input) return;
      const current = input.value.trim();
      const parts = current ? current.split("/").map((item) => item.trim()).filter(Boolean) : [];
      if (!parts.includes(value)) parts.push(value);
      input.value = parts.join(" / ");
      refreshSubscriptionWatch();
    }

    function openResourceDetail(type, id) {
      const resource = (state.resourceOptions || []).find((item) => item.type === type && item.id === id);
      renderResourceReferenceDetail(resource || { id, type, title: "资料详情", summary: "当前资料已关联，可返回继续发布。" });
      setStatus("资料详情已打开", "已连接");
    }

    function setListFilter(key, value) {
      if (!Object.prototype.hasOwnProperty.call(state.filters, key)) return;
      state.filters[key] = key === "sort" ? (value === "latest" ? "latest" : "recommend") : (value || "");
      renderFilters();
      loadData();
    }

    function clearMarketFilters() {
      state.keyword = "";
      state.filters = {
        city: "",
        industry: "",
        demandType: "",
        cardType: "",
        contactRequirement: "",
        sort: "recommend"
      };
      if (els.keyword) els.keyword.value = "";
      loadData();
    }

    function removeMarketFilter(key) {
      if (key === "keyword") {
        state.keyword = "";
        loadData();
        return;
      }
      if (!Object.prototype.hasOwnProperty.call(state.filters, key)) return;
      state.filters[key] = key === "sort" ? "recommend" : "";
      loadData();
    }

    function toggleMarketFilters() {
      state.marketFiltersExpanded = !state.marketFiltersExpanded;
      loadData();
    }

    function previewActionNotice(message = "这是本地预览动作，真实提交请从小程序进入测试环境。") {
      setStatus(message, "预览中");
      window.alert(message);
    }

    async function saveSupplyDemand(statusValue = "draft", cardId = "") {
      if (!state.user) return;
      const draft = snapshotPublishDraft({ id: cardId || (state.publishDraft && state.publishDraft.id) || "" });
      const payload = {
        userId: state.user.id,
        id: draft.id || cardId || null,
        cardType: draft.cardType === "demand" ? "demand" : "supply",
        title: draft.title,
        summary: draft.summary,
        city: draft.city || "长沙",
        industry: draft.industry,
        demandType: draft.demandType || "合作",
        contactRequirement: draft.contactRequirement || "会员可查看",
        tags: draft.tags || [],
        status: statusValue,
        linkedResourceType: draft.linkedResourceType || "",
        linkedResourceId: draft.linkedResourceId || "",
        linkedNoteId: draft.linkedResourceType === "note" ? draft.linkedResourceId || "" : ""
      };
      if (!payload.title) {
        window.alert("请先填写标题");
        return;
      }
      if (state.preview) {
        setStatus(statusValue === "pending_review" ? "预览：已模拟提交审核" : "预览：草稿已模拟保存", "预览中");
        window.alert(statusValue === "pending_review" ? "预览模式下已模拟提交审核" : "预览模式下已模拟保存草稿");
        return;
      }
      try {
        const card = cardId
          ? await apiPut(`/supply-demand/cards/${encodeURIComponent(cardId)}`, payload)
          : await apiPost("/supply-demand/cards", payload);
        if (statusValue === "pending_review") {
          await apiPost(`/supply-demand/cards/${encodeURIComponent(card.id)}/submit`, { userId: state.user.id });
          setStatus("已提交审核", "已连接");
          window.alert("已提交审核");
        } else {
          setStatus("草稿已保存", "已连接");
          window.alert("草稿已保存");
        }
      } catch (error) {
        window.alert(error.message || "保存发布失败");
      }
    }

    async function submitSupplyDemand(id) {
      if (!id || !state.user) return;
      if (state.preview) {
        previewActionNotice("预览模式下已模拟提交审核");
        return;
      }
      try {
        await apiPost(`/supply-demand/cards/${encodeURIComponent(id)}/submit`, { userId: state.user.id });
        setStatus("已提交审核", "已连接");
        window.alert("已提交审核");
        loadData();
      } catch (error) {
        window.alert(error.message || "提交失败");
      }
    }

    async function archiveSupplyDemand(id) {
      if (!id || !state.user) return;
      if (state.preview) {
        const previewCards = ensurePreviewMineCards();
        state.mineCards = previewCards.map((item) => item.id === id ? { ...item, status: "archived" } : item);
        if (mineSectionFromTab(state.activeTab) !== "history") {
          state.activeTab = "mine-history";
          history.replaceState(null, "", buildPageUrl("mine-history"));
        }
        renderMine(state.mineCards, previewReceivedApplications(), previewMyApplications());
        setHero("历史发布", "查看已下架或已结束的历史供需。");
        setStatus("预览：已模拟下架，已移入历史", "预览中");
        return;
      }
      try {
        const card = await apiGet(`/supply-demand/cards/${encodeURIComponent(id)}?userId=${encodeURIComponent(state.user.id)}`);
        await apiPut(`/supply-demand/cards/${encodeURIComponent(id)}`, {
          ...card,
          userId: state.user.id,
          status: "archived"
        });
        setStatus("已下架", "已连接");
        loadData();
      } catch (error) {
        window.alert(error.message || "下架失败");
      }
    }

    async function reviewApplication(id, statusValue) {
      if (!id || !state.user) return;
      if (state.preview) {
        const actionText = statusValue === "accepted" ? "预览：已模拟通过申请" : "预览：已模拟拒绝申请";
        setStatus(actionText, "预览中");
        window.alert(actionText);
        return;
      }
      try {
        await apiPost(`/supply-demand/cards/applications/${encodeURIComponent(id)}/review`, {
          userId: state.user.id,
          status: statusValue
        });
        setStatus(statusValue === "accepted" ? "已通过申请" : "已拒绝申请", "已连接");
        loadData();
      } catch (error) {
        window.alert(error.message || "处理申请失败");
      }
    }

    function recordPackageEvent(packageId, eventType) {
      if (!packageId || !state.user) return Promise.resolve();
      return apiPost(`/response-packages/${encodeURIComponent(packageId)}/events`, {
        eventType,
        viewerId: state.user.id,
        metadata: { source: "resource_tools" }
      }).catch(() => null);
    }

    function copyPackageText(text, packageId = "") {
      const value = text || "";
      recordPackageEvent(packageId, "copy");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(value).then(() => {
          window.alert("回应内容已复制");
        }).catch(() => {
          window.prompt("请长按复制回应内容", value);
        });
        return;
      }
      window.prompt("请长按复制回应内容", value);
    }

    function handleAction(action, type, id, extra = {}) {
      if (action === "back") {
        if (["opportunities", "market", "saved", "subscription", "publish", "mine"].includes(state.activeTab)) {
          showList();
          setStatus("已返回列表", "已连接");
        } else {
          showHome();
          setStatus("已返回资源工具", "已连接");
        }
        return;
      }
      if (action === "open-module") {
        switchTab(extra.tab || "opportunities");
        return;
      }
      if (action === "refresh") {
        loadData();
        return;
      }
      if (action === "reload-page") {
        window.location.reload();
        return;
      }
      if (action === "return-miniapp") {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.reload();
        }
        return;
      }
      if (action === "noop") {
        return;
      }
      if (action === "detail") {
        openDetail(type, id);
        return;
      }
      if (action === "save") {
        saveOpportunity(id);
        return;
      }
      if (action === "unlock") {
        unlockContact(id);
        return;
      }
      if (action === "apply") {
        applySupplyDemand(id);
        return;
      }
      if (action === "package") {
        createPackage(id);
        return;
      }
      if (action === "open-package") {
        openPackage(extra.packageId || "", id);
        return;
      }
      if (action === "save-subscription") {
        saveSubscription();
        return;
      }
      if (action === "search-market") {
        searchMarket();
        return;
      }
      if (action === "clear-market-filters") {
        clearMarketFilters();
        return;
      }
      if (action === "remove-market-filter") {
        removeMarketFilter(extra.filterKey || "");
        return;
      }
      if (action === "toggle-market-filters") {
        toggleMarketFilters();
        return;
      }
      if (action === "set-filter") {
        setListFilter(extra.filterKey || "", extra.filterValue || "");
        return;
      }
      if (action === "append-keyword") {
        appendSubscriptionKeyword(extra.value || "");
        return;
      }
      if (action === "resource-detail") {
        openResourceDetail(extra.resourceType || "", extra.resourceId || "");
        return;
      }
      if (action === "edit-contact") {
        switchTab("publish");
        setStatus("已返回发布页编辑联系要求", "已连接");
        return;
      }
      if (action === "copy-package") {
        copyPackageText(decodeURIComponent(extra.text || ""), id);
        return;
      }
      if (action === "package-radar") {
        openPackageRadar(id);
        return;
      }
      if (action === "save-supply") {
        saveSupplyDemand(extra.status || "draft", extra.cardId || "");
        return;
      }
      if (action === "preview-supply") {
        renderSupplyPreview({ id: extra.cardId || "" });
        setStatus("已生成预览", "已连接");
        return;
      }
      if (action === "submit-supply") {
        submitSupplyDemand(id);
        return;
      }
      if (action === "review-application") {
        reviewApplication(id, extra.status || "accepted");
        return;
      }
      if (action === "select-resource") {
        selectResource(extra.resourceType || "", extra.resourceId || "");
        return;
      }
      if (action === "clear-resource") {
        clearResource();
        return;
      }
      if (action === "set-card-type") {
        setCardType(extra.value || "supply");
        return;
      }
      if (action === "quick-fill") {
        quickFillInput(extra.inputId || "", extra.value || "");
        if ((extra.inputId || "").startsWith("sub-")) refreshSubscriptionWatch();
        return;
      }
      if (action === "edit-supply") {
        editSupplyDemand(id);
        return;
      }
      if (action === "archive-supply") {
        archiveSupplyDemand(id);
      }
    }

    els.tabOpportunities.addEventListener("click", () => switchTab("opportunities"));
    els.tabMarket.addEventListener("click", () => switchTab("market"));
    els.tabSaved.addEventListener("click", () => switchTab("saved"));
    els.tabSubscription.addEventListener("click", () => switchTab("subscription"));
    els.tabPublish.addEventListener("click", () => switchTab("publish"));
    els.tabMine.addEventListener("click", () => switchTab("mine"));
    els.refresh.addEventListener("click", () => {
      if (!state.activeTab) {
        showHome();
        setStatus("资源工具已刷新", "已连接");
        return;
      }
      loadData();
    });
    els.search.addEventListener("click", () => {
      state.keyword = els.keyword.value.trim();
      loadData();
    });
    els.actionbar.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      handleAction(button.dataset.action, button.dataset.type, button.dataset.id, button.dataset);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      if (event.target && event.target.id === "market-search-keyword") {
        event.preventDefault();
        searchMarket();
      }
    });

    document.addEventListener("input", (event) => {
      const target = event.target;
      if (!target || !target.id) return;
      if (["sub-looking", "sub-providing", "sub-city", "sub-keywords"].includes(target.id)) {
        refreshSubscriptionWatch();
        return;
      }
      if (["sd-title", "sd-summary", "sd-city", "sd-industry", "sd-demand-type", "sd-contact", "sd-tags"].includes(target.id)) {
        snapshotPublishDraft();
      }
    });
    els.keyword.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        state.keyword = els.keyword.value.trim();
        loadData();
      }
    });
    els.filters.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      setListFilter(button.dataset.filterKey || "", button.dataset.filterValue || "");
    });
    els.list.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      handleAction(button.dataset.action, button.dataset.type, button.dataset.id, button.dataset);
    });
    els.list.addEventListener("change", (event) => {
      const input = event.target.closest("[data-filter-input]");
      if (!input) return;
      setListFilter(input.dataset.filterInput || "", input.value.trim());
    });
    els.list.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      const input = event.target.closest("[data-filter-input]");
      if (!input) return;
      setListFilter(input.dataset.filterInput || "", input.value.trim());
    });
    els.detail.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      handleAction(button.dataset.action, button.dataset.type, button.dataset.id, button.dataset);
    });
    els.home.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      handleAction(button.dataset.action, button.dataset.type, button.dataset.id, button.dataset);
    });

    verifySession()
      .then(() => {
        const page = initialPage();
        if (page) {
          switchTab(page);
        } else {
          loadLeadHome();
        }
      })
      .catch((error) => {
        const message = error.message || "请从小程序重新进入";
        if (isSessionExpiredError(message)) {
          showSessionExpired(message);
          return;
        }
        setStatus("登录态校验失败");
        setError(message);
      });
  </script>
</body>
</html>
