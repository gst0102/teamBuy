<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <title>资料整理助手 · 互帮互助 · 两种积分展示效果稿 V1</title>
  <desc>首页与发布任务页的两种积分展示设计：基础积分与奖励积分。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#17202b" flood-opacity=".13"/>
    </filter>
    <linearGradient id="pointsCard" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0d5"/>
      <stop offset="1" stop-color="#ffe0ac"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" x2="1">
      <stop offset="0" stop-color="#f57a43"/>
      <stop offset="1" stop-color="#e55f36"/>
    </linearGradient>
    <style>
      .font{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
      .ink{fill:#18212b}.muted{fill:#7d858d}.orange{fill:#e5673b}.blueText{fill:#356f9c}.tealText{fill:#217b68}.white{fill:#fff}
      .title{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:31px;font-weight:750}
      .screenTitle{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:28px;font-weight:750}
      .h1{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:25px;font-weight:750}
      .h2{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:19px;font-weight:700}
      .body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:16px;font-weight:450}
      .small{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:14px;font-weight:450}
      .label{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:15px;font-weight:650}
      .num{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif;font-size:58px;font-weight:800}
      .card{fill:#fff;stroke:#e8e4dd;stroke-width:2}.line{stroke:#d9d7d1;stroke-width:2}.strongLine{stroke:#c8c7c1;stroke-width:3}
      .flexCenter{text-anchor:middle;dominant-baseline:middle}.right{text-anchor:end}
    </style>
  </defs>

  <rect width="1800" height="1320" fill="#ece8e1"/>
  <text x="70" y="64" class="title ink">资料整理助手 · 我的工具 / 互帮互助</text>
  <text x="70" y="99" class="body muted">两种积分展示效果稿 V1 · 总积分用于任务排序，基础积分与奖励积分只做来源标识</text>

  <!-- Phone 1: home -->
  <g transform="translate(72 145)" filter="url(#shadow)">
    <rect width="520" height="1110" rx="38" fill="#fbfbfa" stroke="#d6d2ca" stroke-width="3"/>
    <rect x="17" y="17" width="486" height="1076" rx="29" fill="#f7f4ef"/>
    <rect x="205" y="25" width="110" height="10" rx="5" fill="#18212b"/>
    <text x="48" y="82" class="screenTitle ink">互帮互助</text>
    <text x="472" y="82" class="label orange right">我的工具</text>

    <rect x="44" y="108" width="432" height="52" rx="26" fill="#eae7e1"/>
    <rect x="47" y="111" width="101" height="46" rx="23" fill="#fff"/>
    <text x="98" y="135" class="label orange flexCenter">首页</text>
    <text x="205" y="135" class="label muted flexCenter">发布</text>
    <text x="314" y="135" class="label muted flexCenter">任务</text>
    <text x="423" y="135" class="label muted flexCenter">我的</text>

    <!-- Unified balance card -->
    <rect x="44" y="188" width="432" height="292" rx="28" fill="url(#pointsCard)" stroke="#efd3a6" stroke-width="2"/>
    <text x="72" y="226" class="body muted">我的互助积分</text>
    <text x="72" y="293" class="num ink">368</text>
    <text x="188" y="292" class="body muted">分</text>
    <rect x="383" y="214" width="68" height="36" rx="18" fill="#fff8ee"/>
    <text x="417" y="233" class="label orange flexCenter">规则</text>
    <text x="72" y="326" class="small muted">总积分 = 基础积分 + 奖励积分</text>
    <line x1="72" y1="350" x2="448" y2="350" class="strongLine"/>

    <rect x="72" y="371" width="10" height="54" rx="5" fill="#6ca4d0"/>
    <text x="96" y="389" class="label blueText">基础积分</text>
    <text x="96" y="415" class="small muted">100 分 · 初始赠送 / 基础任务</text>
    <rect x="270" y="371" width="10" height="54" rx="5" fill="#51a88d"/>
    <text x="294" y="389" class="label tealText">奖励积分</text>
    <text x="294" y="415" class="small muted">268 分 · 指定奖励 / 奖励任务</text>
    <text x="72" y="458" class="small muted">两种积分都可发布、完成任务和参与首页排序</text>

    <text x="44" y="532" class="h1 ink">任务大厅</text>
    <text x="476" y="532" class="small muted right">按总积分排序</text>
    <rect x="44" y="552" width="258" height="42" rx="21" fill="#e8e6e1"/>
    <rect x="47" y="555" width="125" height="36" rx="18" fill="#fff"/>
    <text x="109" y="573" class="label orange flexCenter">积分优先</text>
    <text x="237" y="573" class="label muted flexCenter">赏金最高</text>
    <rect x="314" y="552" width="162" height="42" rx="21" fill="#e8e6e1"/>
    <rect x="317" y="555" width="74" height="36" rx="18" fill="#fff"/>
    <text x="354" y="573" class="label orange flexCenter">2×</text>
    <text x="433" y="573" class="label muted flexCenter">1×</text>

    <!-- Task card 1: base points -->
    <g transform="translate(44 617)">
      <rect width="432" height="176" rx="22" class="card"/>
      <rect x="18" y="17" width="110" height="30" rx="15" fill="#e9f3fa"/>
      <text x="73" y="32" class="label blueText flexCenter">小程序任务</text>
      <rect x="300" y="14" width="116" height="36" rx="18" fill="#e9f3fa"/>
      <text x="358" y="32" class="label blueText flexCenter">+4 基础积分</text>
      <text x="18" y="82" class="h2 ink">体验一个招聘小程序</text>
      <text x="18" y="111" class="body muted">打开页面，停留后提交体验反馈</text>
      <text x="18" y="143" class="label orange">发布者总积分 368</text>
      <text x="416" y="143" class="label orange right">去完成 ›</text>
    </g>

    <!-- Task card 2: recharge points -->
    <g transform="translate(44 811)">
      <rect width="432" height="176" rx="22" class="card"/>
      <rect x="18" y="17" width="110" height="30" rx="15" fill="#e8f6f1"/>
      <text x="73" y="32" class="label tealText flexCenter">普通任务</text>
      <rect x="286" y="14" width="130" height="36" rx="18" fill="#e8f6f1"/>
      <text x="351" y="32" class="label tealText flexCenter">+8 奖励积分</text>
      <text x="18" y="82" class="h2 ink">帮忙校对一段商品文案</text>
      <text x="18" y="111" class="body muted">按验收标准提交文字修改建议</text>
      <text x="18" y="143" class="label orange">发布者总积分 246</text>
      <text x="416" y="143" class="label orange right">去完成 ›</text>
    </g>

    <rect x="44" y="1011" width="432" height="54" rx="18" fill="#fff" stroke="#dfddd7" stroke-width="2"/>
    <text x="64" y="1038" class="small muted">当前：奖励积分功能已开放 · 提现功能暂未开放</text>
  </g>
  <text x="332" y="1290" class="h1 ink flexCenter">01 首页：总积分 + 类型标识</text>

  <!-- Phone 2: publish -->
  <g transform="translate(660 145)" filter="url(#shadow)">
    <rect width="520" height="1110" rx="38" fill="#fbfbfa" stroke="#d6d2ca" stroke-width="3"/>
    <rect x="17" y="17" width="486" height="1076" rx="29" fill="#f7f4ef"/>
    <rect x="205" y="25" width="110" height="10" rx="5" fill="#18212b"/>
    <text x="48" y="82" class="screenTitle ink">发布任务</text>
    <text x="472" y="82" class="label muted right">取消</text>

    <rect x="44" y="108" width="432" height="52" rx="26" fill="#eae7e1"/>
    <text x="98" y="135" class="label muted flexCenter">首页</text>
    <rect x="151" y="111" width="101" height="46" rx="23" fill="#fff"/>
    <text x="202" y="135" class="label orange flexCenter">发布</text>
    <text x="314" y="135" class="label muted flexCenter">任务</text>
    <text x="423" y="135" class="label muted flexCenter">我的</text>

    <rect x="44" y="188" width="432" height="84" rx="20" fill="#edf4fa" stroke="#cfe1ef" stroke-width="2"/>
    <text x="70" y="218" class="h2 ink">奖励类型只选一种</text>
    <text x="70" y="246" class="small muted">发布后固定显示在任务卡右上角，不混用</text>

    <text x="44" y="322" class="h1 ink">任务标题</text>
    <text x="476" y="322" class="small muted right">让人一眼知道做什么</text>
    <rect x="44" y="342" width="432" height="58" rx="16" fill="#fff" stroke="#cfdce7" stroke-width="2"/>
    <text x="68" y="371" class="body muted">例如：体验一个招聘小程序</text>

    <text x="44" y="445" class="h1 ink">每次奖励</text>
    <rect x="44" y="465" width="150" height="58" rx="16" fill="#fff" stroke="#f1c39e" stroke-width="3"/>
    <text x="78" y="494" class="h2 ink">4</text>
    <text x="130" y="494" class="body muted">分 / 次</text>

    <text x="44" y="573" class="h1 ink">奖励积分类型</text>
    <text x="476" y="573" class="small muted right">默认基础积分</text>
    <rect x="44" y="594" width="432" height="68" rx="20" fill="#e9e6e1"/>
    <rect x="48" y="598" width="204" height="60" rx="18" fill="#e9f3fa" stroke="#8bb8d8" stroke-width="2"/>
    <text x="150" y="628" class="h2 blueText flexCenter">基础积分（默认）</text>
      <text x="364" y="628" class="h2 muted flexCenter">奖励积分</text>

    <rect x="44" y="690" width="432" height="142" rx="22" fill="#fff" stroke="#d6e5ee" stroke-width="2"/>
    <rect x="64" y="712" width="12" height="98" rx="6" fill="#6ca4d0"/>
    <text x="94" y="731" class="h2 blueText">基础积分</text>
    <text x="94" y="761" class="body muted">初始赠送或基础积分任务获得</text>
    <text x="94" y="790" class="body muted">用于发布、完成任务和首页排序</text>
    <text x="94" y="816" class="small muted">卡片显示：+4 基础积分</text>

    <text x="44" y="884" class="h1 ink">任务卡片预览</text>
    <g transform="translate(44 900)">
      <rect width="432" height="139" rx="20" class="card"/>
      <rect x="18" y="16" width="110" height="30" rx="15" fill="#e9f3fa"/>
      <text x="73" y="31" class="label blueText flexCenter">小程序任务</text>
      <rect x="300" y="14" width="116" height="36" rx="18" fill="#e9f3fa"/>
      <text x="358" y="32" class="label blueText flexCenter">+4 基础积分</text>
      <text x="18" y="80" class="h2 ink">体验一个招聘小程序</text>
      <text x="18" y="110" class="small muted">发布后，执行者一眼知道奖励来自哪类积分</text>
    </g>
    <text x="44" y="1070" class="small muted">切换“奖励积分”后，预览及任务卡只改变为：+4 奖励积分</text>
  </g>
  <text x="920" y="1290" class="h1 ink flexCenter">02 发布页：选择类型 + 卡片预览</text>

  <!-- Right-side product rules -->
  <g transform="translate(1260 175)">
    <text x="0" y="0" class="title ink">这版的核心规则</text>
    <line x1="0" y1="25" x2="430" y2="25" class="strongLine"/>
    <circle cx="18" cy="71" r="8" fill="#6ca4d0"/>
    <text x="44" y="78" class="h2 ink">基础积分</text>
    <text x="44" y="108" class="body muted">新用户赠送、基础积分任务奖励</text>
    <text x="44" y="136" class="body muted">用于任务和排序，不作为提现入口</text>
    <circle cx="18" cy="194" r="8" fill="#51a88d"/>
    <text x="44" y="201" class="h2 ink">奖励积分</text>
    <text x="44" y="231" class="body muted">指定奖励获得、奖励积分任务奖励</text>
    <text x="44" y="259" class="body muted">用于任务和排序，后续按规则处理</text>
    <rect x="0" y="311" width="430" height="170" rx="24" fill="#fff" stroke="#dfddd7" stroke-width="2"/>
    <text x="24" y="349" class="h2 ink">用户只需要记住一件事</text>
    <text x="24" y="388" class="body muted">总积分越高，首页排序越靠前。</text>
    <text x="24" y="420" class="body muted">卡片右上角会写清楚：</text>
    <rect x="24" y="441" width="155" height="30" rx="15" fill="#e9f3fa"/>
    <text x="101" y="456" class="label blueText flexCenter">+4 基础积分</text>
    <rect x="194" y="441" width="155" height="30" rx="15" fill="#e8f6f1"/>
    <text x="271" y="456" class="label tealText flexCenter">+4 奖励积分</text>
    <text x="0" y="546" class="h2 ink">发布时怎么选？</text>
    <text x="0" y="581" class="body muted">发布者明确选择，默认“基础积分”。</text>
    <text x="0" y="611" class="body muted">发布后不可改类型，避免结算歧义。</text>
    <text x="0" y="641" class="body muted">不支持一张任务卡混合两类积分。</text>
    <text x="0" y="715" class="h2 ink">视觉识别</text>
    <text x="0" y="750" class="body muted">蓝色：基础积分　·　青绿色：奖励积分</text>
    <text x="0" y="810" class="small muted">注：这是一版讨论稿，当前未修改代码和业务数据。</text>
  </g>
</svg>
