<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="g1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#dfeeff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8f8ee"/>
      <stop offset="1" stop-color="#d7f1e1"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5efff"/>
      <stop offset="1" stop-color="#e9ddff"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .title{font-size:44px;font-weight:900;fill:#0f172a}
      .sub{font-size:24px;fill:#64748b}
      .label{font-size:22px;font-weight:900;fill:#fff}
      .name{font-size:38px;font-weight:900;fill:#123047}
      .small{font-size:22px;fill:#334155}
      .muted{font-size:18px;fill:#64748b}
      .section{font-size:24px;font-weight:900;fill:#172033}
      .pill{font-size:20px;font-weight:800;fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="1180" fill="#f6f8fb"/>
  <text x="70" y="70" class="title">电子名片 4 款模板：卡片首屏与详情页差异</text>
  <text x="70" y="110" class="sub">左侧是客户第一眼看到的名片卡片，右侧是点进去后的详情页结构。四款不是换色，而是服务场景和内容组织不同。</text>

  <g transform="translate(70 165)">
    <text x="0" y="-22" class="section">A. 专业顾问：稳重可信，适合房产/保险/咨询</text>
    <rect x="0" y="0" width="610" height="190" rx="28" fill="url(#g1)" filter="url(#shadow)"/>
    <circle cx="115" cy="95" r="62" fill="#fff" stroke="#f2c46f" stroke-width="6"/>
    <circle cx="115" cy="95" r="50" fill="#b8d8ee"/>
    <text x="210" y="72" class="name">王顾问</text>
    <rect x="210" y="92" width="118" height="38" rx="19" fill="#1677ff"/>
    <text x="232" y="118" class="pill">房产顾问</text>
    <text x="210" y="154" class="small">安居置业 · 城南店</text>
    <text x="385" y="75" class="muted">需求分析 / 方案建议</text>
    <rect x="690" y="-28" width="360" height="246" rx="24" fill="#fff" filter="url(#shadow)"/>
    <rect x="710" y="-6" width="320" height="86" rx="18" fill="url(#g1)"/>
    <text x="735" y="45" class="section">顾问信任首屏</text>
    <rect x="724" y="108" width="68" height="68" rx="34" fill="#1677ff"/>
    <rect x="818" y="108" width="68" height="68" rx="34" fill="#1677ff"/>
    <rect x="912" y="108" width="68" height="68" rx="34" fill="#1677ff"/>
    <text x="724" y="210" class="muted">详情：身份/机构/区域 + 服务介绍</text>
  </g>

  <g transform="translate(70 430)">
    <text x="0" y="-22" class="section">B. 门店名片：突出门店、同城服务、到店预约</text>
    <rect x="0" y="0" width="610" height="190" rx="28" fill="url(#g2)" filter="url(#shadow)"/>
    <circle cx="115" cy="95" r="62" fill="#fff" stroke="#90d5ad" stroke-width="6"/>
    <circle cx="115" cy="95" r="50" fill="#c5ead4"/>
    <text x="210" y="72" class="name" fill="#0f442b">若晴店长</text>
    <rect x="210" y="92" width="118" height="38" rx="19" fill="#11924d"/>
    <text x="232" y="118" class="pill">门店店长</text>
    <text x="210" y="154" class="small">若晴美学工作室</text>
    <text x="385" y="75" class="muted">同城服务 / 预约沟通</text>
    <rect x="690" y="-28" width="360" height="246" rx="24" fill="#fff" filter="url(#shadow)"/>
    <rect x="710" y="-6" width="320" height="86" rx="18" fill="url(#g2)"/>
    <text x="735" y="45" class="section">门店预约详情</text>
    <rect x="724" y="108" width="286" height="52" rx="10" fill="#ecfdf3"/>
    <text x="742" y="142" class="small">门店信息 / 服务项目 / 预约</text>
    <text x="724" y="210" class="muted">详情：门店地址、项目、预约说明优先</text>
  </g>

  <g transform="translate(70 695)">
    <text x="0" y="-22" class="section">C. 专家介绍：突出专业背书、成果、擅长领域</text>
    <rect x="0" y="0" width="610" height="190" rx="28" fill="url(#g3)" filter="url(#shadow)"/>
    <circle cx="115" cy="95" r="62" fill="#fff" stroke="#b7a4f7" stroke-width="6"/>
    <circle cx="115" cy="95" r="50" fill="#dacbff"/>
    <text x="210" y="72" class="name" fill="#32156d">高先生</text>
    <rect x="210" y="92" width="118" height="38" rx="19" fill="#6545d6"/>
    <text x="232" y="118" class="pill">增长专家</text>
    <text x="210" y="154" class="small">景和增长实验室</text>
    <text x="385" y="75" class="muted">案例成果 / 一对一陪跑</text>
    <rect x="690" y="-28" width="360" height="246" rx="24" fill="#fff" filter="url(#shadow)"/>
    <rect x="710" y="-6" width="320" height="86" rx="18" fill="url(#g3)"/>
    <text x="735" y="45" class="section">专家背书详情</text>
    <rect x="724" y="108" width="84" height="84" rx="14" fill="#f5f0ff"/>
    <rect x="826" y="108" width="84" height="84" rx="14" fill="#f5f0ff"/>
    <rect x="928" y="108" width="84" height="84" rx="14" fill="#f5f0ff"/>
    <text x="724" y="210" class="muted">详情：擅长领域、案例成果、预约咨询</text>
  </g>

  <g transform="translate(70 960)">
    <text x="0" y="-22" class="section">D. 简洁微信风：轻量转发，像个人微信名片</text>
    <rect x="0" y="0" width="610" height="160" rx="28" fill="url(#g4)" filter="url(#shadow)"/>
    <circle cx="115" cy="80" r="50" fill="#e2e8f0"/>
    <text x="210" y="62" class="name">微信顾问</text>
    <rect x="210" y="82" width="118" height="36" rx="18" fill="#172033"/>
    <text x="236" y="106" class="pill">保障顾问</text>
    <text x="360" y="62" class="muted">复制微信 / 快速分享</text>
    <rect x="690" y="-28" width="360" height="216" rx="24" fill="#fff" filter="url(#shadow)"/>
    <circle cx="870" cy="38" r="44" fill="#e2e8f0"/>
    <text x="800" y="116" class="section">居中个人页</text>
    <text x="724" y="176" class="muted">详情：头像居中、少字段、联系按钮更轻</text>
  </g>
</svg>
