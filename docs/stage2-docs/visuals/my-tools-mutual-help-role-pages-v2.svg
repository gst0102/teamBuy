<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17202b" flood-opacity=".16"/>
    </filter>
    <linearGradient id="pageBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="1" stop-color="#f0f4f7"/>
    </linearGradient>
    <linearGradient id="mission" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#254a76"/>
      <stop offset="1" stop-color="#18334f"/>
    </linearGradient>
    <linearGradient id="reward" x1="0" x2="1">
      <stop offset="0" stop-color="#ff8b4a"/>
      <stop offset="1" stop-color="#e9672e"/>
    </linearGradient>
    <style>
      .sans{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}
      .ink{fill:#202a34}.white{fill:#fff}.muted{fill:#77838e}.soft{fill:#a4b2be}
      .orange{fill:#e7672e}.navy{fill:#254a76}.green{fill:#268452}.red{fill:#b4554b}
      .title{font-size:28px;font-weight:800}.h1{font-size:27px;font-weight:800}.h2{font-size:20px;font-weight:800}
      .body{font-size:16px}.small{font-size:13px}.tiny{font-size:11px}.num{font-size:32px;font-weight:800}
      .center{text-anchor:middle}.right{text-anchor:end}.line{stroke:#e6e8e9;stroke-width:2}
      .phone{fill:#fdfdfc;stroke:#d7d4cf;stroke-width:3}.screen{fill:url(#pageBg)}
      .card{fill:#fff;stroke:#e6e9eb;stroke-width:2}.blueCard{fill:#edf5fb;stroke:#d8e6f1;stroke-width:2}
      .orangeCard{fill:#fff0df;stroke:#f4d2b2;stroke-width:2}.greenCard{fill:#edf8f1;stroke:#cce8d6;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="1120" fill="#e9e5df"/>
  <text x="72" y="62" class="sans title ink">资料整理助手 · 互帮互助 V2 角色页面讨论稿</text>
  <text x="72" y="93" class="sans body muted">同一份任务数据，拆成两种目标：执行者负责完成，发布者负责验收和管理；分享链接默认进入执行者页面。</text>

  <!-- Executor page -->
  <g transform="translate(72 135)" filter="url(#shadow)">
    <rect width="680" height="900" rx="38" class="phone"/>
    <rect x="24" y="24" width="632" height="852" rx="29" class="screen"/>
    <rect x="265" y="33" width="150" height="13" rx="8" fill="#202a34"/>
    <text x="52" y="89" class="sans h1 ink">任务详情</text>
    <rect x="492" y="57" width="130" height="46" rx="23" class="orangeCard"/>
    <text x="557" y="86" class="sans body orange center">分享给好友</text>

    <rect x="52" y="121" width="576" height="68" rx="22" fill="#fff" stroke="#e9e4dd" stroke-width="2"/>
    <text x="123" y="162" class="sans body muted center">首页</text>
    <text x="265" y="162" class="sans body muted center">发布</text>
    <rect x="315" y="131" width="116" height="48" rx="18" fill="#fff0df"/>
    <text x="373" y="162" class="sans body orange center">任务</text>
    <text x="553" y="162" class="sans body muted center">我的</text>

    <rect x="52" y="214" width="576" height="158" rx="27" fill="url(#mission)"/>
    <rect x="78" y="239" width="116" height="32" rx="16" fill="#42688f"/>
    <text x="136" y="261" class="sans small white center">小程序任务</text>
    <rect x="528" y="239" width="75" height="40" rx="20" fill="#fff0df"/>
    <text x="566" y="265" class="sans h2 orange center">+4 分</text>
    <text x="78" y="311" class="sans h1 white">鱼泡任务</text>
    <text x="78" y="344" class="sans body" fill="#c9d8e5">完成体验并提交反馈 · 剩余 18 份</text>

    <rect x="52" y="394" width="576" height="72" rx="24" class="card"/>
    <circle cx="94" cy="430" r="22" fill="#eef3f7"/>
    <text x="94" y="435" class="sans body navy center">01</text>
    <text x="133" y="426" class="sans h2 ink">先看清楚怎么完成</text>
    <text x="133" y="450" class="sans small muted">任务说明和验收标准都在下面</text>
    <text x="586" y="436" class="sans h2 orange right">当前</text>

    <rect x="52" y="487" width="576" height="160" rx="25" class="card"/>
    <text x="78" y="526" class="sans h2 ink">任务说明</text>
    <text x="78" y="558" class="sans body ink">打开目标小程序，体验首页和搜索流程，</text>
    <text x="78" y="586" class="sans body ink">返回后写下你的真实感受。</text>
    <line x1="78" y1="610" x2="602" y2="610" class="line"/>
    <text x="78" y="636" class="sans small muted">完成后可获得 4 积分</text>

    <rect x="52" y="667" width="576" height="117" rx="25" class="blueCard"/>
    <text x="78" y="705" class="sans h2 navy">目标小程序</text>
    <rect x="78" y="719" width="310" height="47" rx="16" fill="#fff"/>
    <text x="100" y="749" class="sans body ink">鱼泡任务 · 点击进入体验</text>
    <text x="586" y="750" class="sans h1 green right">›</text>

    <rect x="52" y="806" width="576" height="55" rx="27" fill="url(#reward)"/>
    <text x="340" y="841" class="sans h2 white center">打开目标小程序</text>
  </g>
  <text x="412" y="1074" class="sans title ink center">A · 执行者任务详情</text>
  <text x="412" y="1100" class="sans body muted center">分享链接进入这里：看标准 → 打开小程序 → 返回提交</text>

  <!-- Publisher page -->
  <g transform="translate(848 135)" filter="url(#shadow)">
    <rect width="680" height="900" rx="38" class="phone"/>
    <rect x="24" y="24" width="632" height="852" rx="29" class="screen"/>
    <rect x="265" y="33" width="150" height="13" rx="8" fill="#202a34"/>
    <text x="52" y="89" class="sans h1 ink">任务管理</text>
    <rect x="492" y="57" width="130" height="46" rx="23" class="orangeCard"/>
    <text x="557" y="86" class="sans body orange center">分享任务</text>

    <rect x="52" y="121" width="576" height="68" rx="22" fill="#fff" stroke="#e9e4dd" stroke-width="2"/>
    <text x="123" y="162" class="sans body muted center">首页</text>
    <text x="265" y="162" class="sans body muted center">发布</text>
    <text x="407" y="162" class="sans body muted center">任务</text>
    <rect x="484" y="131" width="116" height="48" rx="18" fill="#fff0df"/>
    <text x="542" y="162" class="sans body orange center">我的</text>

    <rect x="52" y="214" width="576" height="153" rx="27" fill="#fff" stroke="#e6e9eb" stroke-width="2"/>
    <rect x="78" y="239" width="96" height="32" rx="16" class="greenCard"/>
    <text x="126" y="261" class="sans small green center">进行中</text>
    <text x="78" y="311" class="sans h1 ink">鱼泡任务</text>
    <text x="78" y="344" class="sans body muted">小程序任务 · 每完成 1 份扣 5 分 · 剩余 18 份</text>
    <rect x="518" y="290" width="85" height="49" rx="18" class="orangeCard"/>
    <text x="560" y="321" class="sans h2 orange center">+4 分</text>

    <rect x="52" y="389" width="576" height="102" rx="25" class="card"/>
    <text x="78" y="424" class="sans small muted">任务进度</text>
    <text x="78" y="463" class="sans num ink">6</text><text x="126" y="463" class="sans body muted">已完成</text>
    <line x1="229" y1="420" x2="229" y2="463" class="line"/>
    <text x="260" y="463" class="sans num orange">2</text><text x="308" y="463" class="sans body muted">待验收</text>
    <line x1="412" y1="420" x2="412" y2="463" class="line"/>
    <text x="443" y="463" class="sans num navy">18</text><text x="498" y="463" class="sans body muted">剩余</text>

    <text x="52" y="531" class="sans h2 ink">待我验收 <tspan class="muted" font-size="15">先处理这里</tspan></text>
    <rect x="52" y="549" width="576" height="145" rx="25" class="orangeCard"/>
    <circle cx="91" cy="589" r="22" fill="#f7c299"/>
    <text x="91" y="595" class="sans body white center">A</text>
    <text x="127" y="584" class="sans h2 ink">执行者 A***</text>
    <text x="127" y="610" class="sans small muted">10 分钟前提交 · 文字 + 1 张图片</text>
    <rect x="78" y="630" width="154" height="39" rx="19" fill="#fff"/>
    <text x="155" y="655" class="sans small orange center">查看提交材料</text>
    <rect x="391" y="630" width="103" height="39" rx="19" fill="url(#reward)"/>
    <text x="442" y="655" class="sans small white center">通过并结算</text>
    <rect x="502" y="630" width="77" height="39" rx="19" fill="#fff" stroke="#e8b891" stroke-width="2"/>
    <text x="540" y="655" class="sans small red center">补交</text>

    <rect x="52" y="718" width="576" height="67" rx="22" class="card"/>
    <text x="78" y="759" class="sans h2 ink">任务说明与验收标准</text>
    <text x="586" y="759" class="sans h1 orange right">›</text>
    <rect x="52" y="806" width="276" height="55" rx="27" class="card"/>
    <text x="190" y="841" class="sans h2 orange center">分享任务</text>
    <rect x="344" y="806" width="284" height="55" rx="27" fill="#20384f"/>
    <text x="486" y="841" class="sans h2 white center">暂停发布</text>
  </g>
  <text x="1188" y="1074" class="sans title ink center">B · 发布者任务管理</text>
  <text x="1188" y="1100" class="sans body muted center">从“我的”进入：看进度 → 验收提交 → 结算或补交</text>
</svg>
