# The WeCom admin should use this single callback URL:
# https://api.lifelove.top/wecom/archive/callback
#
# Add this location to the public api.lifelove.top server block. Remove the
# legacy Petlove gateway callback location before enabling the core worker.
location = /wecom/archive/callback {
    proxy_pass http://127.0.0.1:8050/wecom/archive/callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# Project consumers use this public base URL for media retrieval:
# WECOM_ARCHIVE_CORE_MEDIA_BASE_URL=https://api.lifelove.top
# The project token is checked by the core; do not expose the core upstream
# directly from an application container.
location ^~ /v1/projects/ {
    proxy_pass http://127.0.0.1:8050/v1/projects/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
